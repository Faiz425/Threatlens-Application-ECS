name: ThreatLens CI/CD

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: threatlens
  ECS_CLUSTER: threatlens
  ECS_SERVICE: threatlens
  CONTAINER_NAME: threatlens

jobs:
  deploy:
    name: Build, Scan and Deploy
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # TEMPORARY DEBUG STEP
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('sts.amazonaws.com');

            const payload = JSON.parse(
              Buffer.from(
                token.split('.')[1],
                'base64url'
              ).toString()
            );

            console.log('OIDC issuer:', payload.iss);
            console.log('OIDC audience:', payload.aud);
            console.log('OIDC subject:', payload.sub);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::113462084471:role/threatlens-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} .
          docker tag $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            $REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          format: table
          exit-code: 0
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push Docker image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:latest

      - name: Download current ECS task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition ${{ env.ECS_SERVICE }} \
            --query taskDefinition \
            --output json > ecs/task-definition-current.json

      - name: Update task definition image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          python - <<'PY'
          import json
          import os

          path = "ecs/task-definition-current.json"

          with open(path) as f:
              task = json.load(f)

          task["containerDefinitions"][0]["image"] = (
              f"{os.environ['REGISTRY']}/"
              f"{os.environ['ECR_REPOSITORY']}:"
              f"{os.environ['GITHUB_SHA']}"
          )

          allowed = [
              "family",
              "taskRoleArn",
              "executionRoleArn",
              "networkMode",
              "containerDefinitions",
              "volumes",
              "placementConstraints",
              "requiresCompatibilities",
              "cpu",
              "memory",
              "pidMode",
              "ipcMode",
              "proxyConfiguration",
              "inferenceAccelerators",
              "ephemeralStorage",
              "runtimePlatform"
          ]

          cleaned = {
              key: task[key]
              for key in allowed
              if key in task
          }

          with open(path, "w") as f:
              json.dump(cleaned, f)

          PY

      - name: Register new ECS task definition
        id: task-definition
        run: |
          TASK_DEFINITION=$(aws ecs register-task-definition \
            --cli-input-json file://ecs/task-definition-current.json \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task-definition=$TASK_DEFINITION" >> "$GITHUB_OUTPUT"

      - name: Deploy to ECS
        run: |
          aws ecs update-service \
            --cluster ${{ env.ECS_CLUSTER }} \
            --service ${{ env.ECS_SERVICE }} \
            --task-definition ${{ steps.task-definition.outputs.task-definition }} \
            --force-new-deployment

      - name: Wait for ECS deployment
        run: |
          aws ecs wait services-stable \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }}

      - name: Verify deployment
        run: |
          aws ecs describe-services \
            --cluster ${{ env.ECS_CLUSTER }} \
            --services ${{ env.ECS_SERVICE }} \
            --query 'services[0].{Desired:desiredCount,Running:runningCount,Status:status}' \
            --output table